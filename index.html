<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Barıştın mı?</title>
    <!-- Konfeti kütüphanesi -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100dvh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 45px 30px;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            max-width: 380px;
            width: 100%;
            z-index: 1;
        }

        .icon-box {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            animation: float 2.5s infinite ease-in-out;
        }

        h1 {
            color: #2d3436;
            font-size: 30px;
            margin-bottom: 35px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            height: 55px;
        }

        button {
            padding: 14px 34px;
            font-size: 18px;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        #yesBtn {
            background-color: #2ecc71;
            color: white;
            box-shadow: 0 6px 20px rgba(46, 204, 113, 0.35);
        }

        #yesBtn:active {
            transform: scale(0.95);
        }

        #noBtn {
            background-color: #ff4757;
            color: white;
            box-shadow: 0 6px 20px rgba(255, 71, 87, 0.35);
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: 999;
        }

        .success-message {
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .success-message h2 {
            color: #2ecc71;
            font-size: 44px;
            margin-top: 15px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
    </style>
</head>
<body>

    <div class="container" id="mainCard">
        <!-- İlk Soru Ekranı -->
        <div id="questionBox">
            <div class="icon-box">
                <!-- Minimalist Soru İşareti İkonu -->
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#667eea" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </svg>
            </div>
            <h1>Barıştın mı?</h1>
            <div class="buttons">
                <button id="yesBtn">Evet</button>
                <button id="noBtn">Hayır</button>
            </div>
        </div>

        <!-- Evet'e Basınca Çıkan Ekran -->
        <div class="success-message" id="successBox">
            <div class="icon-box">
                <!-- Minimalist Onay İkonu -->
                <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#2ecc71" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
            </div>
            <h2>Yuppi!</h2>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const questionBox = document.getElementById('questionBox');
        const successBox = document.getElementById('successBox');

        function moveButton(e) {
            if (e) e.preventDefault();

            if (noBtn.style.position !== 'fixed') {
                noBtn.style.position = 'fixed';
            }

            const padding = 20;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;

            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        noBtn.addEventListener('touchstart', moveButton, { passive: false });
        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('click', moveButton);

        yesBtn.addEventListener('click', () => {
            questionBox.style.display = 'none';
            noBtn.style.display = 'none';
            successBox.style.display = 'flex';

            const duration = 3 * 1000;
            const end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 6,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#ff4757', '#2ecc71', '#ffa502', '#3742fa']
                });
                confetti({
                    particleCount: 6,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#ff4757', '#2ecc71', '#ffa502', '#3742fa']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        });
    </script>
</body>
</html>
